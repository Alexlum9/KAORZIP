<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KAORZIP — Локальная система управления графиками сотрудников банка" />
  <title>KAORZIP — Управление графиками</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-layout">

  <!-- ═══════════════════ SIDEBAR ═══════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark">KZ</div>
        <div class="logo-info">
          <span class="logo-title">KAORZIP</span>
          <span class="logo-sub">HR Scheduler</span>
        </div>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" title="Закрыть меню">&#10005;</button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <span class="nav-group-label">Обзор</span>
        <a class="nav-link active" data-page="dashboard" href="#dashboard">
          <span class="nav-ico">&#9689;</span>
          <span class="nav-txt">Dashboard</span>
        </a>
        <a class="nav-link" data-page="timeline" href="#timeline">
          <span class="nav-ico">&#9632;&#9632;&#9632;</span>
          <span class="nav-txt">Timeline</span>
        </a>
        <a class="nav-link" data-page="breaks" href="#breaks">
          <span class="nav-ico">&#9749;</span>
          <span class="nav-txt">Перерывы</span>
        </a>
        <a class="nav-link" data-page="calendar" href="#calendar">
          <span class="nav-ico">&#128197;</span>
          <span class="nav-txt">Календарь</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Сотрудники</span>
        <a class="nav-link" data-page="employees" href="#employees">
          <span class="nav-ico">&#9678;</span>
          <span class="nav-txt">Список</span>
        </a>
        <a class="nav-link" data-page="favorites" href="#favorites">
          <span class="nav-ico">&#9733;</span>
          <span class="nav-txt">Избранные</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">Данные</span>
        <a class="nav-link" data-page="import" href="#import">
          <span class="nav-ico">&#8681;</span>
          <span class="nav-txt">Импорт Excel</span>
        </a>
        <a class="nav-link" data-page="export" href="#export">
          <span class="nav-ico">&#8679;</span>
          <span class="nav-txt">Экспорт</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-tools">
        <button class="tool-btn" id="themeBtn" title="Тёмная тема">&#9790;</button>
        <button class="tool-btn" id="compactBtn" title="Компактный режим">&#8864;</button>
        <button class="tool-btn" id="fullscreenBtn" title="Полный экран">&#9645;</button>
      </div>
      <div class="sidebar-version">v1.0 &bull; 2026</div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ═══════════════════ MAIN ═══════════════════ -->
  <div class="main-wrapper">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-start">
        <button class="icon-btn hamburger" id="hamburger" title="Меню">&#9776;</button>
        <div class="breadcrumb" id="breadcrumb">Dashboard</div>
      </div>

      <div class="topbar-center">
        <div class="date-nav">
          <button class="date-btn" id="prevDateBtn" title="Назад">&#8249;</button>
          <button class="date-display" id="dateDisplay"></button>
          <button class="date-btn" id="nextDateBtn" title="Вперёд">&#8250;</button>
          <button class="btn btn-sm btn-ghost" id="todayBtn">Сегодня</button>
        </div>
      </div>

      <div class="topbar-end">
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input class="search-input" id="globalSearch" type="text" placeholder="Поиск сотрудника..." autocomplete="off" />
          <div class="search-dropdown" id="searchDropdown"></div>
        </div>
      </div>
    </header>

    <!-- PAGES -->
    <div class="content-area" id="contentArea">

      <!-- DASHBOARD -->
      <section class="page" id="page-dashboard">
        <div class="page-top">
          <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle" id="dashSubtitle"></p>
          </div>
          <div class="page-actions">
            <select class="select-sm" id="dashDeptFilter">
              <option value="">Все отделы</option>
            </select>
          </div>
        </div>
        <div id="dashContent"></div>
      </section>

      <!-- TIMELINE -->
      <section class="page hidden" id="page-timeline">
        <div class="page-top">
          <div>
            <h1 class="page-title">Timeline смен</h1>
            <p class="page-subtitle" id="timelineSubtitle"></p>
          </div>
          <div class="page-actions">
            <select class="select-sm" id="tlDeptFilter"><option value="">Все отделы</option></select>
            <select class="select-sm" id="tlSVFilter"><option value="">Все СВ</option></select>
            <select class="select-sm" id="tlShiftFilter">
              <option value="">Все смены</option>
              <option value="1">Смена 1</option>
              <option value="2">Смена 2</option>
              <option value="3">Смена 3</option>
            </select>
            <button class="btn btn-sm btn-outline" id="scrollNowBtn">&#9201; Сейчас</button>
          </div>
        </div>
        <div id="timelineContent"></div>
      </section>

      <!-- BREAKS -->
      <section class="page hidden" id="page-breaks">
        <div class="page-top">
          <div>
            <h1 class="page-title">График перерывов</h1>
            <p class="page-subtitle" id="breaksSubtitle"></p>
          </div>
          <div class="page-actions">
            <select class="select-sm" id="brkDeptFilter"><option value="">Все отделы</option></select>
            <select class="select-sm" id="brkSVFilter"><option value="">Все СВ</option></select>
          </div>
        </div>
        <div id="breaksContent"></div>
      </section>

      <!-- CALENDAR -->
      <section class="page hidden" id="page-calendar">
        <div class="page-top">
          <div>
            <h1 class="page-title">Календарь</h1>
          </div>
          <div class="page-actions">
            <select class="select-sm" id="calEmpFilter"><option value="">Все сотрудники</option></select>
            <select class="select-sm" id="calDeptFilter"><option value="">Все отделы</option></select>
          </div>
        </div>
        <div id="calendarContent"></div>
      </section>

      <!-- EMPLOYEES -->
      <section class="page hidden" id="page-employees">
        <div class="page-top">
          <div>
            <h1 class="page-title">Сотрудники</h1>
            <p class="page-subtitle" id="empSubtitle"></p>
          </div>
          <div class="page-actions">
            <input class="search-input-inline" id="empSearch" type="text" placeholder="Поиск..." autocomplete="off" />
            <select class="select-sm" id="empDeptFilter"><option value="">Все отделы</option></select>
            <select class="select-sm" id="empSVFilter"><option value="">Все СВ</option></select>
            <select class="select-sm" id="empShiftFilter">
              <option value="">Все смены</option>
              <option value="1">Смена 1</option>
              <option value="2">Смена 2</option>
              <option value="3">Смена 3</option>
            </select>
            <select class="select-sm" id="empStatusFilter">
              <option value="">Все статусы</option>
              <option value="work">Работает</option>
              <option value="21">Ночная</option>
              <option value="ОТ">Отпуск</option>
              <option value="БЛ">Больничный</option>
              <option value="НЯ">Неявка</option>
            </select>
          </div>
        </div>
        <div id="empContent"></div>
      </section>

      <!-- FAVORITES -->
      <section class="page hidden" id="page-favorites">
        <div class="page-top">
          <h1 class="page-title">&#9733; Избранные</h1>
        </div>
        <div id="favContent"></div>
      </section>

      <!-- IMPORT -->
      <section class="page hidden" id="page-import">
        <div class="page-top">
          <h1 class="page-title">Импорт данных</h1>
        </div>
        <div id="importContent"></div>
      </section>

      <!-- EXPORT -->
      <section class="page hidden" id="page-export">
        <div class="page-top">
          <h1 class="page-title">Экспорт</h1>
        </div>
        <div id="exportContent"></div>
      </section>

      <!-- EMPLOYEE PROFILE -->
      <section class="page hidden" id="page-employee">
        <div id="profileContent"></div>
      </section>

    </div><!-- /content-area -->
  </div><!-- /main-wrapper -->
</div><!-- /app-layout -->

<!-- ═══ EMPLOYEE MODAL ═══ -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" id="employeeModal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Сотрудник</h2>
      <button class="icon-btn" id="modalClose">&#10005;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast-stack" id="toastStack"></div>

<!-- ═══ LEGEND FAB ═══ -->
<div class="legend-fab" id="legendFab">
  <button class="legend-trigger" id="legendToggle" title="Цветовая легенда">&#9636;</button>
  <div class="legend-panel hidden" id="legendPanel">
    <div class="legend-header">Цветовая легенда</div>
    <div class="legend-list" id="legendList"></div>
  </div>
</div>

<!-- ═══ SCRIPTS ═══ -->
<!-- For offline use: download these to a /lib/ folder and update src paths -->
<script>
  window.XLSX_AVAILABLE = false;
  window.H2C_AVAILABLE = false;
  window.JSPDF_AVAILABLE = false;
</script>
<script
  src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  onload="window.XLSX_AVAILABLE=true"
  onerror="console.info('SheetJS unavailable — Excel import disabled')">
</script>
<script
  src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
  onload="window.H2C_AVAILABLE=true"
  onerror="console.info('html2canvas unavailable — PNG export disabled')">
</script>
<script
  src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
  onload="window.JSPDF_AVAILABLE=true"
  onerror="console.info('jsPDF unavailable — PDF export disabled')">
</script>
<script src="app.js"></script>
</body>
</html>
